<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a2210">
<title>守護者的失落寶藏 · 最終封印</title>
<style>
@font-face{font-family:"Kai";src:url(data:font/woff2;base64,{{FONT_KAI_R}}) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Kai";src:url(data:font/woff2;base64,{{FONT_KAI_B}}) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Cinzel";src:url(data:font/woff2;base64,{{FONT_CINZEL}}) format("woff2");font-weight:700;font-display:block}
:root{--img-bg:url({{IMG_BG}});--img-parch:url({{IMG_PARCH}});--ink:#3a2210;--red:#b83221;--cream:#fff1d0;--rule:#e2b664}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b1a0c;color:var(--ink);font-family:"Kai","PingFang TC","Microsoft JhengHei",serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
img{-webkit-user-drag:none;user-select:none}
#backdrop{position:fixed;inset:-60px;background:#2b1a0c var(--img-bg) center/cover;filter:blur(20px) brightness(.6) sepia(.3)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;opacity:0;transition:opacity .7s;background:#efe0bd}
#stage.shown{opacity:1}
#bg{position:absolute;inset:0;background:var(--img-bg) center/cover;animation:breathe 26s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.005)}to{transform:scale(1.04) translateY(-5px)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 82% 80% at 50% 52%,rgba(0,0,0,0) 58%,rgba(104,58,16,.34) 100%)}
canvas{position:absolute;left:0;top:0;pointer-events:none}

/* ---------- card-style frame: triple red-brown lines + compass corners ---------- */
#frame{position:absolute;inset:14px;border:1.6px solid rgba(112,36,20,.8);pointer-events:none;z-index:20}
#frame::before{content:"";position:absolute;inset:4px;border:3px solid rgba(112,36,20,.85)}
#frame::after{content:"";position:absolute;inset:11px;border:1.6px solid rgba(112,36,20,.8)}
#frame i{position:absolute;width:82px;height:82px;background:url({{IMG_COMPASS}}) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(60,30,10,.25))}
#frame .tl{left:-35.5px;top:-35.5px}#frame .tr{right:-35.5px;top:-35.5px}#frame .bl{left:-35.5px;bottom:-35.5px}#frame .br{right:-35.5px;bottom:-35.5px}

/* ---------- ribbons (same shape and colours as the clue-card title ribbons) ---------- */
.ribbon{position:relative;display:block}
.ribbon svg{display:block;overflow:visible}
.ribbon>span{position:absolute;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cream);font-weight:700;white-space:nowrap;text-shadow:0 2px 0 rgba(60,14,6,.6)}

/* ---------- title / banner ---------- */
#title,#banner{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:12;transition:opacity .7s,transform .7s}
.hdr{font-size:22px;font-weight:700;letter-spacing:.16em;padding-left:.16em;color:#8a2614;margin-bottom:2px;text-shadow:0 0 3px #fdf3da,0 0 8px #fdf3da,0 0 14px #fdf3da}
#title.away,#stage:not(.started) #title{opacity:0;transform:translateY(-36px)}
#banner{opacity:0;transform:scale(.5) rotate(-4deg);transition:opacity .5s,transform .9s cubic-bezier(.3,1.6,.5,1)}
#banner.show{opacity:1;transform:none}

/* ---------- magic circle (ink-drawn, glows gold) ---------- */
#circle{position:absolute;perspective:1100px;pointer-events:none;opacity:0;transition:opacity 1.4s}
#stage.shown #circle{opacity:.8}
#circle .tilt{width:100%;height:100%;transform:rotateX(76deg)}
#circle svg{width:100%;height:100%;overflow:visible;color:#8b5a20;animation:spin 90s linear infinite;filter:drop-shadow(0 0 3px rgba(255,240,180,.95)) drop-shadow(0 0 10px rgba(255,214,120,.6));transition:color .4s}
#circle.bad svg{color:#c0301e;filter:drop-shadow(0 0 4px rgba(255,140,110,.95)) drop-shadow(0 0 14px rgba(255,80,50,.6))}
#circle.gold svg{color:#e3a01c;animation-duration:10s;filter:drop-shadow(0 0 5px rgba(255,240,160,1)) drop-shadow(0 0 24px rgba(255,196,70,.85))}
#stage.solved #circle{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- chest ---------- */
#rays,#glow{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1.3s}
#rays{background:repeating-conic-gradient(rgba(255,204,92,.78) 0deg 6deg,rgba(255,236,170,0) 6deg 15deg);-webkit-mask-image:radial-gradient(closest-side,#000 16%,rgba(0,0,0,.75) 48%,transparent 100%);mask-image:radial-gradient(closest-side,#000 16%,rgba(0,0,0,.75) 48%,transparent 100%);animation:spin 46s linear infinite}
#glow{background:radial-gradient(closest-side,rgba(255,252,225,.95),rgba(255,222,120,.5) 45%,rgba(255,200,80,0) 100%)}
#stage.solved #rays{opacity:1}
#stage.solved #glow{opacity:.9}
#chestShadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(70,42,14,.5),rgba(70,42,14,0));pointer-events:none;transition:opacity .5s}
#chestBox{position:absolute;transform-origin:50% 100%;pointer-events:none}
#chestBox img{position:absolute;left:0;top:0;width:100%;height:100%}
#chestClosed{filter:drop-shadow(0 8px 6px rgba(70,40,10,.35));transition:opacity .5s}
#chestOpen{opacity:0;transition:opacity .5s}
#stage.solved #chestOpen{opacity:1;animation:treasureGlow 2.8s ease-in-out infinite}
#stage.solved #chestClosed{opacity:0}
@keyframes treasureGlow{0%,100%{filter:drop-shadow(0 8px 6px rgba(70,40,10,.35)) drop-shadow(0 0 16px rgba(255,214,110,.5))}50%{filter:drop-shadow(0 8px 6px rgba(70,40,10,.35)) drop-shadow(0 0 38px rgba(255,214,110,.95))}}
#chestBox.pre,#chestShadow.pre{opacity:0}
#chestBox.drop{animation:dropIn 1s cubic-bezier(.3,0,.7,1) both}
@keyframes dropIn{0%{transform:translateY(-640px);opacity:0}8%{opacity:1}55%{transform:translateY(0) scale(1.04,.94)}66%{transform:translateY(-34px) scale(.98,1.03)}78%{transform:translateY(0) scale(1.015,.985)}89%{transform:translateY(-9px)}100%{transform:translateY(0)}}
#chestBox.rumble{animation:rumble .11s linear infinite}
@keyframes rumble{0%{transform:translate(0,0)}25%{transform:translate(-4px,1px) rotate(-.5deg)}50%{transform:translate(3px,-1px) rotate(.4deg)}75%{transform:translate(-2px,0) rotate(-.3deg)}100%{transform:translate(0,0)}}

/* ---------- chains ---------- */
#chains{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;transition:opacity .6s;filter:drop-shadow(0 4px 2px rgba(50,28,8,.35))}
#chains.pre{opacity:0}
#chains.rattle{animation:rattle .5s linear}
@keyframes rattle{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}

/* ---------- the big padlock ---------- */
#lock{position:absolute;width:600px;height:570px;z-index:6}
#lockScale{position:absolute;inset:0;transform-origin:50% 0}
#lockInner{position:absolute;inset:0;transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
#lock.pre #lockInner{animation:none;opacity:0}
#lock.enter #lockInner{animation:swingIn 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes swingIn{0%{opacity:0;transform:translateY(-320px) rotate(0)}32%{opacity:1;transform:translateY(0) rotate(8deg)}52%{transform:rotate(-5deg)}70%{transform:rotate(2.8deg)}85%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}}
#lock.shake #lockInner{animation:lockShake .65s cubic-bezier(.36,.07,.19,.97)}
@keyframes lockShake{10%,90%{transform:translateX(-3px) rotate(-.8deg)}20%,80%{transform:translateX(7px) rotate(1.6deg)}30%,50%,70%{transform:translateX(-14px) rotate(-3deg)}40%,60%{transform:translateX(14px) rotate(3deg)}}
#lock.drop{transition:transform 1.05s cubic-bezier(.55,0,.9,.55),opacity .8s .3s;transform:translateY(780px) rotate(28deg);opacity:0}
#shackle{position:absolute;left:128px;top:-8px;width:344px;height:294px;transform-origin:313px 198px;transition:transform .55s cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 6px 4px rgba(60,34,10,.28))}
#lock.open #shackle{transform:translateY(-64px) rotate(11deg)}
#body{position:absolute;left:0;top:190px;width:600px;height:380px;background:url({{IMG_LOCK}}) center/100% 100% no-repeat;filter:drop-shadow(0 14px 10px rgba(60,34,10,.38))}
#seal{position:absolute;left:-44px;top:136px;width:122px;height:122px;transform:rotate(-12deg);filter:drop-shadow(0 4px 3px rgba(60,20,10,.4));z-index:3;pointer-events:none}
#lockRibbon{position:absolute;z-index:2;pointer-events:none}
#dials{position:absolute;left:50px;right:50px;top:46px;display:flex;justify-content:space-between}
.dial{width:104px;display:flex;flex-direction:column;align-items:center}
.arrow{width:104px;height:40px;display:flex;align-items:center;justify-content:center;color:#4a2a12;transition:transform .1s,color .2s}
.arrow svg{width:42px;height:42px;stroke-width:3.4}
.arrow:hover{color:#a3271a}
.arrow:active{transform:scale(.8)}
.win{position:relative;width:104px;height:156px;border-radius:16px;overflow:hidden;cursor:ns-resize;touch-action:none;border:3.5px solid var(--ink);background:linear-gradient(180deg,#d4bc8e 0%,#f2e3c3 26%,#fdf7e7 50%,#f2e3c3 74%,#d4bc8e 100%);box-shadow:0 0 0 4px var(--tc),0 0 0 7px var(--ink),0 5px 0 4px rgba(58,34,16,.22);transition:box-shadow .25s}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.strip span{display:block;height:92px;line-height:102px;text-align:center;font-family:"Cinzel",serif;font-weight:700;font-size:80px;color:var(--ink);transition:color .3s}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(212,188,142,.95) 0%,rgba(242,227,195,0) 30%,rgba(242,227,195,0) 70%,rgba(212,188,142,.95) 100%),linear-gradient(100deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.35) 46%,rgba(255,255,255,0) 60%)}
.dial.focus .win{box-shadow:0 0 0 4px var(--tc),0 0 0 7px var(--ink),0 0 20px 9px rgba(255,214,100,.95)}
.dial.bad .win{animation:bad .75s}
@keyframes bad{30%,65%{box-shadow:0 0 0 4px #e0301c,0 0 0 7px var(--ink),0 0 24px 9px rgba(230,50,30,.85)}}
.dial.ok .win{box-shadow:0 0 0 4px var(--tc),0 0 0 7px var(--ink),0 0 30px 13px rgba(255,214,90,1)}
.dial.ok .strip span{color:var(--td)}
.tname{margin-top:8px;font-weight:700;font-size:21px;line-height:1;padding:8px 14px 7px;border-radius:12px;background:var(--tc);color:var(--to);letter-spacing:.08em;border:2.4px solid #32180a;box-shadow:inset 0 0 0 3px var(--tc),inset 0 0 0 4.6px var(--tr),0 3px 0 rgba(50,24,10,.25)}

/* ---------- buttons ---------- */
#unlockBtn{position:absolute;z-index:14;animation:pulse 2.4s ease-in-out infinite;transition:opacity .5s}
#unlockBtn>span svg{width:34px;height:34px;stroke-width:2.6}
#unlockBtn:active{transform:translateY(3px) scale(.97)}
#unlockBtn.ready{animation:pulseStrong 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 5px 0 rgba(58,20,8,.3))}50%{filter:drop-shadow(0 5px 0 rgba(58,20,8,.3)) drop-shadow(0 0 14px rgba(255,214,110,.9))}}
@keyframes pulseStrong{0%,100%{filter:drop-shadow(0 5px 0 rgba(58,20,8,.3)) drop-shadow(0 0 6px rgba(255,220,110,.7));transform:scale(1)}50%{filter:drop-shadow(0 5px 0 rgba(58,20,8,.3)) drop-shadow(0 0 24px rgba(255,214,90,1));transform:scale(1.07)}}
#unlockBtn.pre,#unlockBtn.hide{opacity:0;pointer-events:none}
.tagbtn{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--cream);background:var(--red);border:2.6px solid #3a1408;box-shadow:inset 0 0 0 4px var(--red),inset 0 0 0 6px var(--rule),0 5px 0 rgba(58,20,8,.35);text-shadow:0 2px 0 rgba(60,14,6,.6);transition:transform .12s}
.tagbtn:active{transform:translateY(3px)}

/* ---------- spirit / speech bubble ---------- */
#spirit{position:absolute;cursor:pointer;transition:opacity 1.1s;filter:drop-shadow(0 6px 5px rgba(60,34,10,.32));z-index:8}
#spirit img{width:100%;display:block;pointer-events:none;animation:float 4.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}
#spirit.hop img{animation:hop .75s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-50px) rotate(-5deg) scale(1.04)}100%{transform:translateY(0)}}
#spirit.pre{opacity:0;pointer-events:none}
#bubble{position:absolute;padding:16px 24px 18px;border-radius:26px;font-size:25px;line-height:1.55;min-height:70px;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink);background:#f3e4c2 var(--img-parch) center/cover;border:3px solid var(--ink);box-shadow:0 7px 0 rgba(58,34,16,.2);transition:opacity .35s;z-index:9}
#bubble .tail{position:absolute;display:none;overflow:visible}
#bubble[data-side=bottom]{transform-origin:20% 100%}
#bubble[data-side=left]{transform-origin:0 30%}
#bubble[data-side=bottom] .tb{display:block;left:var(--tail,64px);bottom:-35px;width:40px;height:38px}
#bubble[data-side=left] .tl{display:block;left:-35px;top:var(--tail,40px);width:38px;height:40px}
#bubble.pre{opacity:0}
#bubble.pop{animation:bubblePop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes bubblePop{from{transform:scale(.82)}to{transform:scale(1)}}

/* ---------- virtues: rope-ring medallions like the clue cards ---------- */
#virtues{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:40px;pointer-events:none;z-index:11}
.virtue{display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.3) translateY(40px);transition:opacity .4s,transform .65s cubic-bezier(.3,1.7,.5,1)}
.virtue.show{opacity:1;transform:none}
.virtue .medal{width:126px;height:126px;display:flex;align-items:center;justify-content:center;color:#5a3414;background:url({{IMG_MEDAL}}) center/contain no-repeat;filter:drop-shadow(0 6px 4px rgba(60,34,10,.35))}
.virtue .medal svg{width:54px;height:54px;stroke-width:2.2}
.virtue b{margin-top:-8px;font-size:24px;line-height:1;letter-spacing:.2em;padding:7px 10px 6px 15px;border-radius:12px;background:var(--red);color:var(--cream);border:2.4px solid #3a1408;box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4.6px var(--rule),0 3px 0 rgba(50,24,10,.28)}

/* ---------- misc ---------- */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:15;background:radial-gradient(circle at var(--fx,50%) var(--fy,45%),rgba(255,253,236,.95),rgba(255,238,170,.55) 28%,rgba(255,226,140,0) 70%)}
#flash.go{animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#controls{position:absolute;top:34px;right:92px;display:flex;gap:12px;z-index:40}
.ctl{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);background:#f3e4c2 var(--img-parch) center/cover;border:2.6px solid var(--ink);box-shadow:0 4px 0 rgba(58,34,16,.25)}
.ctl svg{width:26px;height:26px;stroke-width:2.3}
.ctl:active{transform:translateY(2px)}
#resetBtn{position:absolute;right:92px;bottom:34px;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 9px;border-radius:30px;color:var(--ink);font-weight:700;font-size:19px;background:#f3e4c2 var(--img-parch) center/cover;border:2.6px solid var(--ink);box-shadow:0 4px 0 rgba(58,34,16,.25);opacity:0;pointer-events:none;transition:opacity .6s;z-index:40;touch-action:none}
#resetBtn.show{opacity:1;pointer-events:auto}
#resetBtn .ring{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--red) calc(var(--p,0) * 1%),rgba(58,34,16,.18) 0)}
#resetBtn .ring span{width:28px;height:28px;border-radius:50%;background:#f8eed8;display:flex;align-items:center;justify-content:center}
#resetBtn svg{width:16px;height:16px;stroke-width:2.6}

/* ---------- intro scroll ---------- */
#intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:radial-gradient(ellipse at center,rgba(50,30,10,.2),rgba(36,20,6,.72));transition:opacity 1s}
#intro.hide{opacity:0;pointer-events:none}
#scrollWrap{transform-origin:50% 50%}
#scroll{position:relative;width:578px;height:862px;background:url({{IMG_SCROLL}}) center/100% 100% no-repeat;filter:drop-shadow(0 26px 34px rgba(30,16,4,.6));transform-origin:50% 7%;animation:unroll 1.3s cubic-bezier(.2,.9,.25,1) both}
@keyframes unroll{0%{transform:scaleY(.07);opacity:0}25%{opacity:1}100%{transform:scaleY(1);opacity:1}}
#intro.hide #scroll{animation:rollup .75s cubic-bezier(.6,0,.85,.4) both}
@keyframes rollup{from{transform:scaleY(1);opacity:1}to{transform:scaleY(.05);opacity:0}}
#scrollText{position:absolute;left:18%;right:18%;top:15%;bottom:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3e230e}
#scrollText .k{font-size:17px;letter-spacing:.22em;color:#7a5530}
#scrollText h2{font-size:36px;color:#7a1c0b;letter-spacing:.04em;margin:10px 0 4px;line-height:1.2;white-space:nowrap}
#scrollText .t{font-size:21px;letter-spacing:.3em;padding-left:.3em;color:#6a4626;margin-bottom:20px}
#scrollText .p{font-size:20.5px;line-height:1.9;color:#4a2a12;white-space:nowrap}
#startBtn{margin-top:28px;width:236px;height:64px;border-radius:16px;font-size:27px;letter-spacing:.3em;padding-left:.3em;animation:pulse 2.2s ease-in-out infinite}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="stage">
  <div id="bg"></div>
  <canvas id="fxBack"></canvas>
  <div id="vignette"></div>
  <div id="circle"><div class="tilt"></div></div>
  <div id="rays"></div>
  <div id="glow"></div>
  <div id="chestShadow" class="pre"></div>
  <div id="chestBox" class="pre"><img id="chestClosed" alt="寶箱" src="{{IMG_CHEST_CLOSED}}"><img id="chestOpen" alt="打開的寶箱" src="{{IMG_CHEST_OPEN}}"></div>
  <svg id="chains" class="pre" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="lock" class="pre"><div id="lockScale"><div id="lockInner">
    <img id="shackle" alt="" src="{{IMG_SHACKLE}}">
    <div id="body"><div id="dials"></div></div>
    <div id="lockRibbon" class="ribbon" data-bw="236" data-bh="46" data-fs="25"><span>守護者封印</span></div>
    <img id="seal" alt="" src="{{IMG_SEAL}}">
  </div></div></div>
  <button id="unlockBtn" class="ribbon pre" data-bw="190" data-bh="64" data-fs="36" aria-label="開鎖"><span><i class="ic"></i>開鎖</span></button>
  <div id="spirit" class="pre" role="button" aria-label="森林守護精靈"><img alt="" src="{{IMG_SPIRIT}}"></div>
  <div id="bubble" class="pre" data-side="bottom"><p id="bubbleText"></p>
    <svg class="tail tb" viewBox="0 0 40 38"><polygon points="0,0 40,0 6,38" fill="#f0e0bb"/><path d="M1 1 L6 37 L39 1" fill="none" stroke="#3a2210" stroke-width="3" stroke-linejoin="round"/></svg>
    <svg class="tail tl" viewBox="0 0 38 40"><polygon points="38,0 38,40 0,6" fill="#f0e0bb"/><path d="M37 1 L1 6 L37 39" fill="none" stroke="#3a2210" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>
  <div id="title"><div class="hdr">第 82 旅幼童軍 · 最終封印</div><div class="ribbon" data-bw="560" data-bh="70" data-fs="42"><span>守護者的失落寶藏</span></div></div>
  <div id="banner"><div class="hdr">封印解除 · 四隊勇士合力成功</div><div class="ribbon" data-bw="640" data-bh="76" data-fs="46"><span>傳奇寶藏重見天日！</span></div></div>
  <div id="virtues"></div>
  <canvas id="fxFront"></canvas>
  <div id="flash"></div>
  <div id="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <div id="controls"><button class="ctl" id="muteBtn" aria-label="聲音開關"></button><button class="ctl" id="fsBtn" aria-label="全螢幕"></button></div>
  <button id="resetBtn" aria-label="按住重新上鎖"><span class="ring"><span class="ic"></span></span>按住重新上鎖</button>
  <div id="intro"><div id="scrollWrap"><div id="scroll"><div id="scrollText">
    <div class="k">第 82 旅幼童軍 · 尋寶大冒險</div>
    <h2>守護者的失落寶藏</h2>
    <div class="t">最終封印</div>

<script>
(() => {
'use strict';
/* =====  settings  =====  (passcode can also be overridden with  ?code=1234  in the address) */

const INTRO_MSG = '四隊的勇士們，歡迎來到最終封印！每隊轉動自己顏色的轉輪，輸入解開的數字，再按「開鎖」。';

/* stage layouts: chest {w, cx = visual centre, bottom}, lock {cx, top = top edge of the lock body, s = scale} */
const LAYOUTS = {

      title: 18, spirit: {x: 40, y: 468, w: 318}, bubble: {x: 34, bottom: 462, w: 462, side: 'bottom', tail: 232},

/* =====  helpers  ===== */

const rand = (a, b) => a + Math.random() * (b - a);

const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const restart = (el, c) => { el.classList.remove(c); void el.getBoundingClientRect(); el.classList.add(c); };
const stage = $('#stage'), lockEl = $('#lock'), chestBox = $('#chestBox'), chainsSvg = $('#chains'), circleEl = $('#circle');

/* =====  card-style ribbon (same geometry as the printed clue-card ribbons)  ===== */
function makeRibbon(el) {
  const bw = +el.dataset.bw, bh = +el.dataset.bh, fs = +el.dataset.fs;
  const tail = bh * .95, drop = bh * .3, notch = bh * .32, fold = bh * .42, m = 6;
  const W = bw + 2 * tail + 2 * m, H = bh + drop + 2 * m, x0 = m + tail, y0 = m, x1 = x0 + bw, y1 = y0 + bh;
  const t0 = y0 + drop, t1 = y1 + drop, my = (t0 + t1) / 2, lw = Math.max(2.6, bh * .05), ins = bh * .13;
  const P = a => a.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  const svg = `<svg width="${W.toFixed(1)}" height="${H.toFixed(1)}" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" aria-hidden="true">` +
    `<g stroke="#3a1408" stroke-width="${lw.toFixed(1)}" stroke-linejoin="round">` +
    `<polygon fill="#96261a" points="${P([[x0 + fold, t0], [x0 - tail, t0], [x0 - tail + notch, my], [x0 - tail, t1], [x0 + fold, t1]])}"/>` +
    `<polygon fill="#96261a" points="${P([[x1 - fold, t0], [x1 + tail, t0], [x1 + tail - notch, my], [x1 + tail, t1], [x1 - fold, t1]])}"/>` +
    `<polygon fill="#5c140c" points="${P([[x0, y1], [x0 + fold, y1], [x0 + fold, t1]])}"/>` +
    `<polygon fill="#5c140c" points="${P([[x1, y1], [x1 - fold, y1], [x1 - fold, t1]])}"/>` +
    `<rect fill="#b83221" x="${x0.toFixed(1)}" y="${y0}" width="${bw}" height="${bh}"/></g>` +
    `<rect fill="none" stroke="#e2b664" stroke-width="${Math.max(1.8, bh * .035).toFixed(1)}" x="${(x0 + ins).toFixed(1)}" y="${(y0 + ins).toFixed(1)}" width="${(bw - 2 * ins).toFixed(1)}" height="${(bh - 2 * ins).toFixed(1)}"/></svg>`;
  el.insertAdjacentHTML('afterbegin', svg);
  const sp = el.querySelector(':scope > span');
  Object.assign(sp.style, {left: x0 + 'px', top: y0 + 'px', width: bw + 'px', height: bh + 'px', fontSize: fs + 'px', letterSpacing: '.14em', paddingLeft: '.14em'});

}

/* =====  sound (synthesised with Web Audio, no files needed)  ===== */
const sfx = (() => {
  let ac = null, master = null, verb = null, muted = false, amb = null;
  function impulse(sec, decay) {
    const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : .8;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    verb = ac.createConvolver(); verb.buffer = impulse(2.6, 2.4);
    const vg = ac.createGain(); vg.gain.value = .5; verb.connect(vg); vg.connect(master);
  }
  function out(node, wet) { node.connect(master); if (wet) { const s = ac.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); } }
  function tone(f, {t = 0, dur = .4, type = 'sine', vol = .2, a = .005, glide = 0, wet = 0} = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + t, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t0 + dur);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dur);
    o.connect(g); out(g, wet); o.start(t0); o.stop(t0 + a + dur + .05);
  }
  function noise({t = 0, dur = .1, vol = .3, type = 'bandpass', f = 1500, q = 1, wet = 0} = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + t, n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = b;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .004); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(fl); fl.connect(g); out(g, wet); s.start(t0); s.stop(t0 + dur + .02);
  }
  const bell = (f, t = 0, vol = .15, wet = .6) => { tone(f, {t, dur: 1.8, vol, wet}); tone(f * 2.756, {t, dur: .7, vol: vol * .3, wet}); tone(f * 5.404, {t, dur: .35, vol: vol * .12, wet}); };
  const C = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
  return {
    init,
    get muted() { return muted; },
    toggleMute() { muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : .8, ac.currentTime, .05); return muted; },
    tick() { noise({dur: .03, vol: .35, f: 3400, q: 5}); tone(2100, {dur: .025, vol: .04, type: 'square'}); },
    press() { tone(160, {dur: .14, type: 'triangle', vol: .3, glide: 110}); noise({dur: .07, f: 800, vol: .2}); },
    blip() { tone(rand(780, 980), {dur: .04, vol: .025, type: 'triangle'}); },
    whoosh() { noise({dur: .7, type: 'bandpass', f: 600, q: .7, vol: .25, wet: .3}); },
    error() { tone(233, {dur: .2, type: 'sawtooth', vol: .1, glide: 196}); tone(174, {t: .2, dur: .38, type: 'sawtooth', vol: .1, glide: 123}); for (let k = 0; k < 6; k++) noise({t: k * .06, dur: .05, f: 2600, q: 7, vol: .22}); },
    chime(i) { bell([523.25, 659.25, 783.99, 1046.5][i], 0, .2); },
    chime2() { bell(pick([1046.5, 1318.51, 1567.98]), 0, .12, .7); },
    unlock() { noise({dur: .06, f: 1500, q: 3, vol: .45}); tone(280, {dur: .16, type: 'square', vol: .07, glide: 840}); noise({t: .14, dur: .14, f: 700, q: 2, vol: .35}); bell(1567.98, .1, .08); },
    chainClank() { for (let k = 0; k < 7; k++) noise({t: k * .07 + Math.random() * .03, dur: .07, f: rand(2200, 4200), q: 9, vol: .18, wet: .2}); },
    chainBreak() { noise({dur: .12, f: 3000, q: 2, vol: .4}); for (let k = 0; k < 14; k++) noise({t: .05 + k * .045 + Math.random() * .03, dur: .07, f: rand(2400, 5200), q: 9, vol: .16, wet: .25}); },
    thud() { tone(95, {dur: .45, vol: .55, glide: 42}); noise({dur: .3, type: 'lowpass', f: 380, q: .8, vol: .5}); },
    rumble() { noise({dur: 1, type: 'lowpass', f: 160, q: 1, vol: .6}); tone(52, {dur: 1, type: 'sawtooth', vol: .05}); },
    open() { tone(130, {dur: .7, type: 'sawtooth', vol: .05, glide: 240}); C.forEach((f, k) => bell(f, .2 + k * .06, .1, .8)); noise({dur: 1.6, type: 'highpass', f: 5000, q: .5, vol: .08, wet: .6}); },
    fanfare() {
      [[392, 0], [523.25, .16], [659.25, .32], [783.99, .48]].forEach(([f, t]) => { tone(f, {t: .8 + t, dur: .22, type: 'sawtooth', vol: .055, wet: .3}); tone(f * 2, {t: .8 + t, dur: .22, type: 'triangle', vol: .05, wet: .3}); });
      [523.25, 659.25, 783.99, 1046.5].forEach(f => { tone(f, {t: 1.5, dur: 2, type: 'sawtooth', vol: .04, wet: .5}); tone(f / 2, {t: 1.5, dur: 2, type: 'triangle', vol: .05, wet: .5}); });
    },
    coin() { const f = rand(1900, 3200); tone(f, {dur: .1, vol: .04, wet: .2}); tone(f * 1.5, {t: .05, dur: .12, vol: .03, wet: .2}); },
    sparkle() { [0, .07, .14].forEach((t, k) => bell(C[4 + k] * (Math.random() < .5 ? 1 : 1.5), t, .06, .9)); },
    ambient(on, bright) {
      if (!ac) return;
      if (amb) { clearInterval(amb.timer); amb.g.gain.setTargetAtTime(.0001, ac.currentTime, .6); const old = amb; setTimeout(() => old.osc.forEach(o => { try { o.stop(); } catch (e) {} }), 2500); amb = null; }
      if (!on) return;
      const g = ac.createGain(); g.gain.value = .0001; g.gain.setTargetAtTime(bright ? .035 : .045, ac.currentTime, 1.2);
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 650; fl.connect(g); g.connect(master);
      const osc = (bright ? [261.63, 329.63, 392] : [196, 246.94, 293.66]).map(f => { const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = rand(-8, 8); o.connect(fl); o.start(); return o; });
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .08; lg.gain.value = 260; lfo.connect(lg); lg.connect(fl.frequency); lfo.start(); osc.push(lfo);
      const scale = bright ? [1046.5, 1174.66, 1318.51, 1567.98, 1760, 2093] : [587.33, 659.25, 783.99, 880, 987.77, 1174.66];
      const timer = setInterval(() => { if (!muted && document.visibilityState === 'visible') bell(pick(scale), 0, bright ? .045 : .035, .9); }, bright ? 1100 : 1700);
      amb = {g, osc, timer};
    },
  };
})();

/* =====  layout  ===== */
let L = LAYOUTS.L, S = 1, OX = 0, OY = 0, geo = {}, chainsBroken = false;
function place(el, x, y, w, h) { el.style.left = x + 'px'; el.style.top = y + 'px'; if (w != null) el.style.width = w + 'px'; if (h != null) el.style.height = h + 'px'; }
function layout() {
  const portrait = innerHeight > innerWidth * 1.08;
  L = LAYOUTS[portrait ? 'P' : 'L'];
  stage.style.width = L.W + 'px'; stage.style.height = L.H + 'px';
  S = Math.min(innerWidth / L.W, innerHeight / L.H);
  OX = (innerWidth - L.W * S) / 2; OY = (innerHeight - L.H * S) / 2;
  stage.style.transform = `translate(${OX}px,${OY}px) scale(${S})`;
  const w = L.chest.w, h = CHEST.h * w / CHEST.w;
  const x = L.chest.cx - CHEST.centerX[0] * w, y = L.chest.bottom - CHEST.bottom[1] * h;
  geo = {x, y, w, h, bottom: L.chest.bottom, cx: L.chest.cx,
         inside: [x + CHEST.inside[0] * w, y + CHEST.inside[1] * h],
         chainL: [x + CHEST.chainL[0] * w, y + CHEST.chainL[1] * h],
         chainR: [x + CHEST.chainR[0] * w, y + CHEST.chainR[1] * h]};
  place(chestBox, x, y, w, h);
  place($('#chestShadow'), geo.cx - w * .5, L.chest.bottom - 30, w, 56);
  const cd = w * 1.25; place(circleEl, geo.cx - cd / 2, L.chest.bottom - 10 - cd / 2, cd, cd);
  const rd = w * 1.7; place($('#rays'), geo.inside[0] - rd / 2, geo.inside[1] - rd / 2, rd, rd);
  const gd = w * .85; place($('#glow'), geo.inside[0] - gd / 2, geo.inside[1] - gd / 2, gd, gd);
  const ls = L.lock.s;
  geo.lockX = L.lock.cx - LOCK_W / 2; geo.lockY = L.lock.top - SHACKLE_VIS * ls;
  $('#lockScale').style.transform = `scale(${ls})`;
  geo.shackleTop = [L.lock.cx, geo.lockY + 16 * ls];
  place(lockEl, geo.lockX, geo.lockY);
  place(unlockBtn, L.btn.x - unlockBtn.offsetWidth / 2, L.btn.y - unlockBtn.offsetHeight / 2);
  titleEl.style.top = L.title + 'px'; bannerEl.style.top = L.title + 'px';
  place(spiritEl, L.spirit.x, L.spirit.y, L.spirit.w);
  const b = L.bubble;
  bubbleEl.dataset.side = b.side; bubbleEl.style.left = b.x + 'px'; bubbleEl.style.width = b.w + 'px';
  if (b.side === 'bottom') { bubbleEl.style.top = 'auto'; bubbleEl.style.bottom = (L.H - b.bottom) + 'px'; }
  else { bubbleEl.style.bottom = 'auto'; bubbleEl.style.top = b.top + 'px'; }
  bubbleEl.style.setProperty('--tail', b.tail + 'px');
  $('#virtues').style.top = L.virtues + 'px';
  $('#scrollWrap').style.transform = `scale(${L.scroll})`;
  fx.resize();
  if (chainsBroken) chainsSvg.innerHTML = ''; else buildChains();
}
const toStage = (cx, cy) => [(cx - OX) / S, (cy - OY) / S];
const centerOf = el => { const r = el.getBoundingClientRect(); return toStage(r.left + r.width / 2, r.top + r.height / 2); };

/* =====  magic circle made of the 27 cipher signs  ===== */
function buildCircle() {
  let s = '<svg viewBox="-520 -520 1040 1040">';
  s += '<circle r="500" fill="none" stroke="currentColor" stroke-width="6"/>';
  s += '<circle r="470" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="18 12" opacity=".8"/>';
  s += '<circle r="330" fill="none" stroke="currentColor" stroke-width="4" opacity=".9"/>';
  s += '<circle r="300" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>';
  const pts = [];
  for (let k = 0; k < 16; k++) { const r = k % 2 ? 132 : 300, a = k * Math.PI / 8 - Math.PI / 2; pts.push(`${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)}`); }
  s += `<polygon points="${pts.join(' ')}" fill="none" stroke="currentColor" stroke-width="3" opacity=".75"/>`;
  s += '<rect x="-212" y="-212" width="424" height="424" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>';
  s += '<rect x="-212" y="-212" width="424" height="424" transform="rotate(45)" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>';
  SIGNS.forEach(([, , inner], k) => {
    s += `<g transform="rotate(${(k / SIGNS.length * 360).toFixed(2)}) translate(0 -400) scale(2.3) translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${inner}</g>`;
  });
  for (let k = 0; k < 108; k++) {
    const a = k / 108 * 2 * Math.PI, r1 = 482, r2 = k % 4 ? 490 : 499;
    s += `<line x1="${(r1 * Math.cos(a)).toFixed(1)}" y1="${(r1 * Math.sin(a)).toFixed(1)}" x2="${(r2 * Math.cos(a)).toFixed(1)}" y2="${(r2 * Math.sin(a)).toFixed(1)}" stroke="currentColor" stroke-width="2" opacity=".7"/>`;
  }
  $('#circle .tilt').innerHTML = s + '</svg>';
}

/* =====  chains (cartoon links with ink outlines)  ===== */
let links = [], chainAnim = null;
function buildChains() {
  cancelAnimationFrame(chainAnim); chainAnim = null;
  chainsSvg.setAttribute('viewBox', `0 0 ${L.W} ${L.H}`);
  links = [];
  const [bx, by] = geo.shackleTop;
  for (const [ax, ay] of [geo.chainL, geo.chainR]) {
    const mx = (ax + bx) / 2, my = Math.max(ay, by) + 44;
    const n = Math.max(6, Math.round(Math.hypot(bx - ax, by - ay) * 1.08 / 23));
    for (let j = 0; j <= n; j++) {
      const t = j / n, u = 1 - t;
      const x = u * u * ax + 2 * u * t * mx + t * t * bx, y = u * u * ay + 2 * u * t * my + t * t * by;
      const a = Math.atan2(2 * u * (my - ay) + 2 * t * (by - my), 2 * u * (mx - ax) + 2 * t * (bx - mx)) * 180 / Math.PI;
      links.push({x, y, a, odd: j % 2 === 1});
    }
  }
  chainsSvg.innerHTML = links.map((l, k) => `<g data-k="${k}" transform="translate(${l.x.toFixed(1)} ${l.y.toFixed(1)}) rotate(${l.a.toFixed(1)})">` +
    (l.odd ? '<rect x="-15" y="-4.2" width="30" height="8.4" rx="4.2" fill="#9c8f78" stroke="#2e1d0e" stroke-width="2.4"/><line x1="-9" y1="-1.4" x2="9" y2="-1.4" stroke="#d9cfb8" stroke-width="1.6" stroke-linecap="round"/>'
           : '<ellipse rx="15.5" ry="9.4" fill="none" stroke="#2e1d0e" stroke-width="8.6"/><ellipse rx="15.5" ry="9.4" fill="none" stroke="#b3a68c" stroke-width="4.4"/><path d="M-11 -5.5 A13 7 0 0 1 5 -8" fill="none" stroke="#e8e0cc" stroke-width="1.8" stroke-linecap="round"/>') + '</g>').join('');
  links.forEach((l, k) => { l.el = chainsSvg.querySelector(`g[data-k="${k}"]`); });
}
function breakChains() {
  chainsBroken = true;
  const [cx, cy] = geo.shackleTop;
  links.forEach(l => { const dir = Math.sign(l.x - cx) || 1; l.vx = dir * rand(1, 5.5) + rand(-1.5, 1.5); l.vy = rand(-8, -2); l.va = rand(-14, 14); l.life = 0; });
  let last = performance.now();
  const tick = now => {
    const dt = Math.min(2.5, (now - last) / 16.67); last = now;
    let alive = false;
    for (const l of links) {
      l.life += dt; l.vy += .55 * dt; l.x += l.vx * dt; l.y += l.vy * dt; l.a += l.va * dt;
      const op = Math.max(0, 1 - Math.max(0, l.life - 40) / 30);
      if (op > 0 && l.y < L.H + 40) alive = true;
      l.el.setAttribute('transform', `translate(${l.x.toFixed(1)} ${l.y.toFixed(1)}) rotate(${l.a.toFixed(1)})`);
      l.el.setAttribute('opacity', op.toFixed(2));
    }
    chainAnim = alive ? requestAnimationFrame(tick) : null;

/* =====  dials  ===== */
const CELL = 92, WIN = 149, BASE_IDX = 20;          // WIN = inner height of a dial window
const strips = [], pos = [], dialEls = [], touched = new Set();

const canInput = () => started && !busy && !solved;

function setPos(i, p, anim = true) {
  if (anim && (p < 6 || p > 43)) {               // keep the strip away from its ends (visually identical jump)
    const shift = Math.round((p - 25) / 10) * 10;
    pos[i] -= shift; p -= shift;
    strips[i].style.transition = 'none';
    strips[i].style.transform = `translateY(${WIN / 2 - CELL / 2 - pos[i] * CELL}px)`;
    void strips[i].offsetWidth;
  }
  pos[i] = p;
  strips[i].style.transition = anim ? 'transform .3s cubic-bezier(.3,1.45,.5,1)' : 'none';
  strips[i].style.transform = `translateY(${WIN / 2 - CELL / 2 - p * CELL}px)`;
}
function normalize(i) { const target = BASE_IDX + 9 - val(i); if (pos[i] !== target) setPos(i, target, false); }
function focusDial(i) { focusIdx = i; dialEls.forEach((d, j) => d.classList.toggle('focus', j === i)); }
function updateReady() { unlockBtn.classList.toggle('ready', touched.size === 4 && canInput()); }
function input(i, d) {
  if (!canInput()) return;
  sfx.init(); focusDial(i); setPos(i, pos[i] - d); sfx.tick(); touched.add(i); updateReady();
}
function setDigit(i, v) {
  let delta = ((v - val(i)) % 10 + 10) % 10; if (delta > 5) delta -= 10;
  setPos(i, pos[i] - delta); sfx.tick(); touched.add(i);
}
function buildDials() {
  const box = $('#dials');
  TEAMS.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'dial'; d.dataset.k = t.k;
    d.style.setProperty('--tc', t.c); d.style.setProperty('--td', t.d); d.style.setProperty('--tr', t.r); d.style.setProperty('--to', t.o);
    d.innerHTML = `<button class="arrow up" aria-label="${t.n}加一">${icon('chevron-up')}</button>` +
      `<div class="win" role="spinbutton" aria-label="${t.n}轉輪"><div class="strip">${Array.from({length: 50}, (_, j) => `<span>${9 - j % 10}</span>`).join('')}</div></div>` +
      `<button class="arrow down" aria-label="${t.n}減一">${icon('chevron-down')}</button><div class="tname">${t.n}</div>`;
    box.appendChild(d); dialEls.push(d);
    const strip = d.querySelector('.strip'), win = d.querySelector('.win');
    strips.push(strip); pos.push(0); setPos(i, BASE_IDX + 9, false);
    strip.addEventListener('transitionend', () => normalize(i));
    d.querySelector('.up').addEventListener('click', () => input(i, +1));
    d.querySelector('.down').addEventListener('click', () => input(i, -1));

    win.addEventListener('pointerdown', e => {
      if (!canInput()) return;

      drag = {y: e.clientY, moved: false}; focusDial(i); sfx.init();

    if (k >= '0' && k <= '9') {
      if (!canInput()) return;
      sfx.init(); const i = focusIdx < 0 ? 0 : focusIdx; setDigit(i, +k); focusDial((i + 1) % 4); updateReady();
    } else if (k === 'ArrowLeft') { e.preventDefault(); focusDial(Math.max(0, (focusIdx < 0 ? 1 : focusIdx) - 1)); }
    else if (k === 'ArrowRight') { e.preventDefault(); focusDial(Math.min(3, focusIdx + 1)); }
    else if (k === 'ArrowUp') { e.preventDefault(); input(focusIdx < 0 ? 0 : focusIdx, +1); }
    else if (k === 'ArrowDown') { e.preventDefault(); input(focusIdx < 0 ? 0 : focusIdx, -1); }
    else if (k === 'Backspace') { e.preventDefault(); focusDial(Math.max(0, (focusIdx < 0 ? 0 : focusIdx) - 1)); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); tryUnlock(); }
    else if (k === 'm' || k === 'M') { sfx.init(); sfx.toggleMute(); setCtlIcons(); }
    else if (k === 'f' || k === 'F') toggleFS();
  });
  const imgs = [...document.images].map(im => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}));
  Promise.race([Promise.all([document.fonts ? document.fonts.ready : null, ...imgs]), wait(2500)]).then(() => { fx.sprites(); layout(); stage.classList.add('shown'); });
}
init();
})();
